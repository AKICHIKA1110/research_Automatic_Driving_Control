- {type: straight, length: 0.3}
- {type: arc, radius: 0.7, angle_deg: 90}
- {type: straight, length: 0.3}
- {type: arc, radius: 0.7, angle_deg: -45}
- {type: straight, length: 1.5}
- {type: arc, radius: 0.7, angle_deg: -60}
- {type: arc, radius: 0.7, angle_deg: 60}
- {type: straight, length: 3.0}
